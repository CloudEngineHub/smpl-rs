[package]
name = "smpl_py"             # name of the rust crate
edition.workspace = true
publish = false
rust-version.workspace = true
version.workspace = true
authors.workspace = true
description.workspace = true
readme = "README.md"
license.workspace = true

[lib]
crate-type = ["cdylib"] #cdylib is needed for pyo3 and rlib is needed so that is can be linked with other libs https://stackoverflow.com/a/4
name = "smpl_rs" # name of the .so library that the Python module will import

[features]
default = ["with-gui", "private", "selector"]
with-gui=["smpl-gloss-integration/with-gui", "easy-wgpu/with-gui", "gloss-renderer/with-gui"]
selector=["gloss-renderer/selector"]
private=["smpl-core/private"]

extension-module = ["pyo3/extension-module"]
burn-torch = [
    "smpl-gloss-integration/burn-torch",
    "gloss-renderer/burn-torch", 
    "easy-wgpu/burn-torch", 
    "gloss-utils/burn-torch", 
    # "gloss_py/burn-torch", 
    "gloss-burn-multibackend/burn-torch", 
    "wgpu-cuda-interop/cuda",
    "pyo3-tch",
    "tch",
    "burn-tch",
    ]

[dependencies]
smpl-core = {workspace= true, default-features = false}
smpl-gloss-integration = {workspace= true, default-features = true}
smpl-utils = {workspace= true, default-features = false}
# gloss_py= {workspace= true, default-features = false}
gloss_py_macros = {workspace= true, default-features = true}
gloss-renderer = {workspace= true, default-features = true}
gloss-utils = {workspace= true, default-features = true}
gloss-hecs= {workspace= true, default-features = true}
gloss-burn-multibackend= {workspace= true}
easy-wgpu= {workspace= true}
wgpu-burn-global-device= {workspace= true}

pyo3 = { version = "0.21", features = ["macros", "multiple-pymethods", "abi3-py38", "extension-module", "gil-refs"] } #downgrade to 0.17 because rigetti
pyo3-tch = {version = "0.19", optional=true}
tch = { workspace=true, optional=true }
numpy = { version = "0.21", features = ["nalgebra"] }
burn.workspace=true
burn-tch = { workspace=true, optional=true }
log.workspace=true
nalgebra.workspace=true
ndarray.workspace=true
wgpu-cuda-interop = { workspace=true, optional=true }
serde.workspace=true
erased-serde.workspace=true

[lints]
workspace = true
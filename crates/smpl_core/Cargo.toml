[package]
name = "smpl-core"
authors.workspace = true
description = "Core functionality of smpl-rs"
edition.workspace = true
license.workspace = true
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
keywords.workspace = true
documentation = "https://docs.rs/smpl-core"

[features]
default = ["private"]
private = []

[lib]
crate-type = ["rlib"] #making a cdylib would conflict  in name with smpl_py which is named smpl_rs

[dependencies]
smpl-utils.workspace=true

gloss-renderer.workspace=true
gloss-geometry.workspace=true
gloss-img.workspace=true
gloss-utils.workspace=true
gloss-burn-multibackend.workspace=true

log.workspace=true
cfg-if.workspace=true
nalgebra.workspace=true
ndarray.workspace=true
itertools.workspace=true
wasm-timer.workspace=true
serde_json.workspace=true
enum-map.workspace=true
indexmap.workspace=true
strum.workspace=true
strum_macros.workspace=true
num-traits.workspace=true
num-derive.workspace=true
dyn-clone.workspace=true
burn.workspace=true
wgpu.workspace=true
bytemuck.workspace=true
bytemuck_derive.workspace=true
ndarray-npy = { workspace = true, features = ["npz", "compressed_npz"]}
gltf.workspace=true
gltf-json = { workspace=true, features = ["extras", "extensions"] }
image.workspace=true
base64.workspace = true
serde.workspace=true
erased-serde.workspace=true
bincode.workspace=true

[dev-dependencies]
divan.workspace=true

# [target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# native-tls = "=0.2.13"
[build-dependencies]
burn-import.workspace=true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace=true
console_log.workspace=true
wasm-bindgen.workspace=true
wasm-bindgen-futures.workspace=true
web-sys.workspace=true
js-sys.workspace=true

[target.x86_64-unknown-linux-gnu] #slightly faster linking
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[[bench]]
name = "smplx_forward"
harness = false

[lints]
workspace = true



